name = "used-car-scorer"
compatibility_date = "2026-11-01"
pages_build_output_dir = "public"

# Non-secret settings. API keys are Pages secrets, never put here (see README).
[vars]
LLM_PROVIDER = "gemini"
# GEMINI_MODEL = "gemini-3.6-flash"     # optional override
# ANTHROPIC_MODEL = "claude-opus-5-5"   # optional override

[[d1_databases]]
binding = "DB"
database_name = "used-car-scorer"
# Local dev works with this placeholder. Replace with the real ID from
# `npx wrangler d1 create used-car-scorer` before the first deploy (README step 2).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
