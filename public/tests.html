<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scoring Tests</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; background: #fff; color: #111; margin: 0; padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    #summary { font-weight: 600; margin-block-end: 12px; }
    h2 { font-size: 14px; margin: 16px 0 4px; color: #555; }
    .t { padding: 4px 0; border-block-end: 1px solid #eee; }
    .pass::before { content: "✓ "; color: #1a7f37; }
    .fail::before { content: "✗ "; color: #cf222e; }
    .fail { color: #cf222e; }
    .err { display: block; font-family: ui-monospace, monospace; font-size: 12px; padding-inline-start: 16px; }
  </style>
</head>
<body>
  <h1>Scoring tests</h1>
  <div id="summary">Running…</div>
  <div id="out"></div>
  <script type="module">
    import { runAll } from './tests.js';
    const results = runAll();
    const out = document.getElementById('out');
    let group = null;
    for (const r of results) {
      if (r.group !== group) {
        group = r.group;
        const h = document.createElement('h2');
        h.textContent = group;
        out.append(h);
      }
      const d = document.createElement('div');
      d.className = 't ' + (r.pass ? 'pass' : 'fail');
      d.textContent = r.name;
      if (!r.pass) {
        const e = document.createElement('span');
        e.className = 'err';
        e.textContent = r.error;
        d.append(e);
      }
      out.append(d);
    }
    const failed = results.filter((r) => !r.pass).length;
    const s = document.getElementById('summary');
    s.textContent = `${results.length - failed}/${results.length} passed`;
    s.style.color = failed ? '#cf222e' : '#1a7f37';
  </script>
</body>
</html>
