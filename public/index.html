<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>Car Scorer</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand"><img src="/favicon.svg" alt="" class="brand-icon" width="24" height="24"><span id="brand"></span></a>
      <nav class="topbar-actions">
        <button type="button" class="btn link desktop-only" id="langToggle"></button>
        <a href="/auth/logout" class="btn link desktop-only" id="logout"></a>
        <div class="menu">
          <button type="button" class="btn icon" id="menuBtn" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
          </button>
          <div class="menu-pop" id="menuPop" role="menu" hidden>
            <button type="button" role="menuitem" id="menuExport"></button>
            <button type="button" role="menuitem" id="menuImport"></button>
            <hr class="mobile-only">
            <button type="button" role="menuitem" class="mobile-only" id="menuLang"></button>
            <a role="menuitem" class="mobile-only" href="/auth/logout" id="menuLogout"></a>
          </div>
        </div>
        <a href="#/new" class="btn primary" id="addCar"></a>
      </nav>
    </div>
  </header>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <main id="view"></main>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
